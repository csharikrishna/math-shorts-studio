[project]
name = "math-shorts-studio"
version = "0.1.0"
description = "Automated, beat-synced mathematical storytelling video engine built on ManimGX + Edge-TTS + FFmpeg."
requires-python = ">=3.13"
dependencies = [
    "manimgx>=0.1.1",
    "edge-tts>=7.0.0",
    "numpy>=2.0.0",
    "google-genai>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
kokoro = [
    "en-core-web-sm",
    "kokoro>=0.9",
    "soundfile>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
